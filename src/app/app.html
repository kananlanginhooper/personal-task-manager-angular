<div class="wrap">
  @if (store.mode === 'demo') {
    <app-demo-bar />
  }
  <app-page-header />

  @if (store.error(); as e) {
    <div class="status">{{ e }}</div>
  }
  @if (!store.loaded() && !store.error()) {
    <div class="status">Loading your plan…</div>
  }

  <app-recap-banner />

  <!-- the today and week lists share one drop group, so tasks drag between them -->
  <app-board cdkDropListGroup>
    <app-tile tileKey="replan">
      @if (store.overdue().length) {
        <app-replan-banner />
      }
    </app-tile>
    <app-tile tileKey="now">
      @if (store.loaded()) {
        <app-now-card />
      }
    </app-tile>
    <app-tile tileKey="today"><app-today-panel /></app-tile>
    <app-tile tileKey="habits"><app-habits-panel /></app-tile>
    <app-tile tileKey="week"><app-week-panel /></app-tile>
    <app-tile tileKey="evening"><app-evening-card /></app-tile>
    <app-tile tileKey="shopping"><app-shopping-panel /></app-tile>
    <app-tile tileKey="goals"><app-goals-panel /></app-tile>
    <app-tile tileKey="notes"><app-notes-panel /></app-tile>
    <app-tile tileKey="trophies"><app-trophy-shelf /></app-tile>
    <app-tile tileKey="coming"><app-coming-up /></app-tile>
    <app-tile tileKey="wins"><app-recent-wins /></app-tile>
    <app-tile tileKey="log"><app-change-log /></app-tile>
  </app-board>
  <app-layout-bar />
</div>

<app-celebration-layer />
